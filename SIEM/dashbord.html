<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #343a40;
            color: white;
            padding: 10px;
            text-align: center;
        }

        main {
            margin: 20px;
        }

        .alerts {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .alerts h2 {
            margin-top: 0;
        }

        #alert-list {
            list-style-type: none;
            padding: 0;
        }

        #alert-list li {
            background-color: #f8d7da;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            color: #721c24;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        #alert-list li:hover {
            background-color: #f5c6cb;
            cursor: pointer;
            transform: scale(1.02);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        @media (max-width: 600px) {
            main {
                margin: 10px;
            }

            .alerts {
                padding: 15px;
            }

            #alert-list li {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Security Dashboard</h1>
    </header>

    <main>
        <div class="alerts">
            <h2>Real-Time Alerts</h2>
            <ul id="alert-list"></ul>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // Connect to WebSocket server
        const socket = io('http://localhost:5000');

        // Listen for new alerts from the backend
        socket.on('new_alert', function(data) {
            const alertList = document.getElementById('alert-list');
            const alertItem = document.createElement('li');
            alertItem.textContent = data.message;
            alertItem.classList.add('alert-item');
            alertList.prepend(alertItem);

            // Limit the number of alerts displayed
            const maxAlerts = 10;
            if (alertList.children.length > maxAlerts) {
                alertList.removeChild(alertList.lastChild);
            }
        });

        // Handle connection errors
        socket.on('connect_error', function(err) {
            console.error('Connection error:', err);
        });

        socket.on('disconnect', function() {
            console.warn('Disconnected from the server.');
        });
    </script>
</body>
</html>
