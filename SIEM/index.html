<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Name Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 16px;
            margin-bottom: 8px;
        }

        input {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            font-size: 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #responseContainer {
            margin-top: 30px;
            padding: 20px;
            background-color: #e9f7fd;
            border: 1px solid #d6e9f7;
            border-radius: 8px;
            display: none; /* Hide by default */
        }

        pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ddd;
            white-space: pre-wrap; /* Allows for wrapping text */
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter Your App Name</h1>
        <form id="appNameForm">
            <label for="appName">App Name:</label>
            <input type="text" id="appName" name="appName" placeholder="Enter app name" required>
            <button type="submit">Generate Script</button>
        </form>

        <!-- Response container where the generated script will be shown -->
        <div id="responseContainer">
            <h2>Generated Script:</h2>
            <pre id="generatedScript"></pre>
        </div>
    </div>

    <script>
        document.getElementById('appNameForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const appName = document.getElementById('appName').value;

            // Create a JSON object to send
            const data = { appName: appName };

            // Send the request using fetch
            fetch('http://172.17.22.118:5000/api/generate_script', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);

                // Check if the API response contains the script
                if (data.script) {
                    // Display the response script in the UI
                    document.getElementById('generatedScript').textContent = data.script;
                    document.getElementById('responseContainer').style.display = 'block'; // Show the container
                } else {
                    // Display an error message if no script is returned
                    document.getElementById('generatedScript').textContent = 'No script generated. Please try again.';
                    document.getElementById('responseContainer').style.display = 'block'; // Show the container
                }
            })
            .catch((error) => {
                console.error('Error:', error);
                // Show error message on UI if the fetch fails
                document.getElementById('generatedScript').textContent = 'Error occurred while generating the script.';
                document.getElementById('responseContainer').style.display = 'block'; // Show the container
            });
        });
    </script>
</body>
</html>
